name: Check quizzes

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Validate quiz files
        run: python quiz.py validate
      - name: Run the snippets and check every marked answer
        run: python quiz.py verify
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build the single-file app
        run: python quiz.py build
