name: Windows installer

# Builds dist/CodeQuiz-Setup-<version>.exe. Push a tag like v1.0.0 (matching
# VERSION in quiz.py) to attach it to a GitHub release, or run it by hand
# from the Actions tab and download it from the run's artifacts.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["installer/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release and attach the installer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import quiz; print(quiz.VERSION)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version in quiz.py" >&2
            exit 1
          fi
      - name: Build the installer
        run: python installer/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: CodeQuiz-Setup
          path: dist/CodeQuiz-Setup-*.exe
          if-no-files-found: error
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/CodeQuiz-Setup-*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/CodeQuiz-Setup-*.exe --title "Code Quiz ${GITHUB_REF_NAME#v}" --generate-notes
          fi
